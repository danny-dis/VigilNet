[package]
name = "vigilnet-android"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Internal crates
vigilnet-core = { path = "../vigilnet-core" }
vigilnet-crypto = { path = "../vigilnet-crypto" }
vigilnet-routing = { path = "../vigilnet-routing" }
vigilnet-transport = { path = "../vigilnet-transport" }
vigilnet-discovery = { path = "../vigilnet-discovery" }
vigilnet-proxy = { path = "../vigilnet-proxy" }
vigilnet-agent-mesh = { path = "../vigilnet-agent-mesh" }
vigilnet-wireguard = { path = "../vigilnet-wireguard" }
vigilnet-agent-circles = { path = "../vigilnet-agent-circles" }
vigilnet-agent-research = { path = "../vigilnet-agent-research" }
vigilnet-agent-transport = { path = "../vigilnet-agent-transport" }
vigilnet-agent-core = { path = "../vigilnet-agent-core" }
vigilnet-i2p = { path = "../vigilnet-i2p", optional = true }
vigilnet-freenet = { path = "../vigilnet-freenet", optional = true }

# Async runtime
tokio = { workspace = true }
async-trait = "0.1"

# P2P networking (for E2EE transport)
libp2p = { workspace = true }

# Time handling
chrono = "0.4"

# UUID
uuid = { workspace = true }

# Socket handling
socket2 = "0.5"

# Serialization
serde = { workspace = true }
serde_json = "1.0"
bytes = "1.5"
arc-swap = "1.6"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# JNI bridge (for Android)
jni = { version = "0.21", optional = true }

# TUN interface (with fd support for Android VpnService)
tun-rs = { workspace = true }

# Packet parsing
etherparse = "0.13"

# Userspace TCP/IP stack
smoltcp = { version = "0.11", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-udp"] }

# DNS packet parsing
simple-dns = "0.7"

[features]
default = []
android = ["jni"]
i2p = ["vigilnet-i2p"]
freenet = ["vigilnet-freenet"]