repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Rust fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      
      - id: cargo-clippy
        name: Rust clippy
        entry: cargo clippy --workspace --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        
      - id: cargo-test
        name: Rust test
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false
