[package]
name = "vigilnet-tor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
vigilnet-crypto = { path = "../vigilnet-crypto" }
vigilnet-transport = { path = "../vigilnet-transport" }
vigilnet-agent-transport = { path = "../vigilnet-agent-transport" }

tokio = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
base32 = "0.5"

arti-client = { version = "0.16", features = ["tokio", "rustls", "pt-client"] }
tor-rtcompat = { version = "0.16", features = ["tokio", "rustls"] }

[features]
default = []
