[package]
name = "vigilnet-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for VigilNet"

[[bin]]
name = "vigilnet"
path = "src/main.rs"

[dependencies]
vigilnet-core = { workspace = true }
vigilnet-proxy = { workspace = true }
vigilnet-agent-core = { workspace = true }
vigilnet-agent-circles = { workspace = true }
vigilnet-crypto = { workspace = true }

tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

uuid = { workspace = true }
base64 = { workspace = true }
bincode = { workspace = true }
rand = { workspace = true }
