[package]
name = "vigilnet-wireguard"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
vigilnet-crypto = { path = "../vigilnet-crypto" }
vigilnet-transport = { path = "../vigilnet-transport" }
vigilnet-agent-transport = { path = "../vigilnet-agent-transport" }

tokio = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
base64 = "0.21"

boringtun = { version = "0.6", features = ["device"] }
smoltcp = { version = "0.11", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-udp"] }
hex = "0.4"

x25519-dalek = { workspace = true }

[features]
default = []
