[package]
name = "vigilnet-wireguard"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Internal crates
vigilnet-crypto = { path = "../vigilnet-crypto" }
vigilnet-transport = { path = "../vigilnet-transport" }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# WireGuard userspace implementation
boringtun = { version = "0.6", features = ["device"] }
smoltcp = { version = "0.11", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-udp"] }
hex = "0.4"
base64 = "0.21"

# Crypto for WG
x25519-dalek = { workspace = true }
rand = { workspace = true }

[features]
default = []
